<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA Meta -->
    <meta name="application-name" content="Engineer Hub" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Engineer Hub" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Apply theme before first paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('eh-theme');
          var isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <!-- SEO -->
    <title>Engineer Hub – Mumbai University Engineering Platform</title>
    <meta name="description" content="Track attendance, buy/sell projects, freelance, access study resources, and manage your engineering career – all in one platform." />
    <meta name="keywords" content="engineer hub, mumbai university, engineering students, attendance tracker, project marketplace, freelancing, placement drives, internships" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Engineer Hub" />
    <link rel="canonical" href="https://engineerhub.example.com/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Engineer Hub – Mumbai University Engineering Platform" />
    <meta property="og:description" content="The complete platform for Mumbai University engineering students — attendance, marketplace, freelancing, resources, placements and more." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://engineerhub.example.com/" />
    <meta property="og:site_name" content="Engineer Hub" />
    <meta property="og:image" content="https://engineerhub.example.com/icons/icon-512.png" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Engineer Hub – Mumbai University Engineering Platform" />
    <meta name="twitter:description" content="Attendance, marketplace, freelancing, resources, and placements — all in one platform for engineering students." />
    <meta name="twitter:image" content="https://engineerhub.example.com/icons/icon-512.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Engineer Hub",
      "applicationCategory": "EducationApplication",
      "operatingSystem": "Web, Android, iOS",
      "description": "A platform for Mumbai University engineering students covering attendance tracking, a project marketplace, freelancing, study resources, results, and placement drives.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" }
    }
    </script>

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; min-height: 100vh; overflow-x: hidden; }
      #root { min-height: 100vh; display: flex; flex-direction: column; width: 100%; }

      /* Offline banner */
      .offline-indicator {
        position: fixed; top: 0; left: 0; right: 0;
        background: #ef4444; color: white; text-align: center;
        padding: 8px 16px; font-size: 12px; font-weight: 700;
        z-index: 10001; transform: translateY(-100%);
        transition: transform 0.3s ease;
      }
      .offline-indicator.show { transform: translateY(0); }

      /* Initial loader */
      .app-loader {
        position: fixed; inset: 0;
        background: linear-gradient(135deg, #f0fdf4 0%, #eff6ff 100%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 9999; transition: opacity 0.4s ease;
      }
      .app-loader.hide { opacity: 0; pointer-events: none; }
      .loader-ring {
        width: 52px; height: 52px; border-radius: 50%; position: relative;
        border: 4px solid #d1fae5; border-top-color: #059669; border-right-color: #1d4ed8;
        animation: spin 0.9s linear infinite;
      }
      .loader-text {
        margin-top: 14px; font-size: 10px; font-weight: 900; letter-spacing: 0.15em;
        text-transform: uppercase;
        background: linear-gradient(90deg, #059669, #1d4ed8);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="offline-indicator" class="offline-indicator">
      📡 You are offline — Some features may be unavailable
    </div>

    <div id="app-loader" class="app-loader">
      <div class="loader-ring"></div>
      <p class="loader-text">Engineer Hub</p>
    </div>

    <div id="root"></div>

    <script>
      window.hideLoader = function() {
        const l = document.getElementById('app-loader');
        if (l) { l.classList.add('hide'); setTimeout(() => l.remove(), 500); }
      };
      setTimeout(() => { if (document.getElementById('app-loader')) window.hideLoader(); }, 6000);

      function updateOnlineStatus() {
        document.getElementById('offline-indicator')?.classList.toggle('show', !navigator.onLine);
      }
      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);
      updateOnlineStatus();

      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.warn('SW failed:', err));
        });
      }
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
