<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engineer Hub – Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f0fdf4 0%, #eff6ff 100%);
      padding: 1rem;
    }
    .card {
      background: rgba(255,255,255,0.95);
      border: 1px solid rgba(5,150,105,0.2);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; animation: bounce 2s infinite; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    h1 { font-size: 1.5rem; font-weight: 900; color: #059669; margin-bottom: 0.5rem; }
    p { font-size: 0.875rem; color: rgba(30,58,138,0.6); font-weight: 500; line-height: 1.6; margin-bottom: 2rem; }
    .badge {
      display: inline-block; background: linear-gradient(90deg,#059669,#1d4ed8);
      color: white; font-size: 0.6rem; font-weight: 900; letter-spacing: 0.15em;
      text-transform: uppercase; padding: 0.4rem 1rem; border-radius: 999px; margin-bottom: 1.5rem;
    }
    button {
      background: linear-gradient(90deg,#059669,#1d4ed8);
      color: white; border: none; border-radius: 12px;
      padding: 0.875rem 2rem; font-size: 0.75rem; font-weight: 900;
      letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
      transition: transform 0.2s; box-shadow: 0 4px 14px rgba(5,150,105,0.3);
    }
    button:hover { transform: scale(1.03); }
    .tips { margin-top: 2rem; text-align: left; }
    .tip { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #059669; flex-shrink: 0; }
    .tip-text { font-size: 0.75rem; color: rgba(30,58,138,0.5); font-weight: 500; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <div class="badge">No Internet Connection</div>
    <h1>You're Offline</h1>
    <p>Engineer Hub needs an internet connection to load. Please check your Wi-Fi or mobile data and try again.</p>
    <button onclick="window.location.reload()">↺ &nbsp; Try Again</button>
    <div class="tips">
      <div class="tip"><div class="dot"></div><span class="tip-text">Check your Wi-Fi or mobile data</span></div>
      <div class="tip"><div class="dot"></div><span class="tip-text">Try turning airplane mode off/on</span></div>
      <div class="tip"><div class="dot"></div><span class="tip-text">Previously visited pages may still load</span></div>
    </div>
  </div>
</body>
</html>
